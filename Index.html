<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>👑 공주님 옷 입히기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      background: #2a0752;
      font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #viewport { position: fixed; inset: 0; }
    /* 게임 화면은 1160 x 830 크기로 그리고 창 크기에 맞게 확대/축소 */
    #game {
      position: absolute;
      width: 1160px; height: 830px;
      transform-origin: 0 0;
      border-radius: 26px;
      overflow: hidden;
      background:
        repeating-conic-gradient(from 0deg at 210px 560px, rgba(255,255,255,.13) 0deg 6deg, rgba(255,255,255,0) 6deg 17deg),
        radial-gradient(circle at 210px 560px, #ff8be6 0%, #d046dc 28%, #8a26c9 58%, #45107f 100%);
      box-shadow: 0 0 0 5px #ff9fe0, 0 10px 40px rgba(0,0,0,.5);
    }
    #game::after {
      content: ''; position: absolute; inset: 9px;
      border: 3px dashed rgba(255,255,255,.55);
      border-radius: 20px;
      pointer-events: none;
      z-index: 5;
    }
    .castle { position: absolute; left: 0; bottom: 56px; width: 1160px; height: 170px; pointer-events: none; }
    .twinkle {
      position: absolute; color: #fff; pointer-events: none;
      text-shadow: 0 0 8px #fff, 0 0 16px #ffb3f0;
      animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.6) rotate(0); }
      50% { opacity: 1; transform: scale(1.1) rotate(45deg); }
    }

    /* ---------- 공주님 ---------- */
    #dollWrap {
      position: absolute; left: 60px; top: 8px;
      width: 300px; height: 760px;
      transition: left .6s cubic-bezier(.5,1.4,.5,1);
      z-index: 10;
    }
    .pedestal { position: absolute; left: -30px; top: 700px; width: 360px; height: 80px; }
    #doll { position: absolute; left: 0; top: 0; width: 300px; height: 750px; touch-action: none; overflow: visible; }
    #doll .worn { cursor: grab; }
    #doll .eyes { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
    #dollWrap.hover #doll { filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #ffe45c); }
    #dollWrap.hover .pedestal { filter: brightness(1.3); }
    .burst {
      position: absolute; pointer-events: none; font-size: 26px; z-index: 30;
      animation: burst .9s ease-out forwards;
    }
    @keyframes burst {
      0% { opacity: 0; transform: translate(0,0) scale(.3); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(120deg); }
    }

    /* ---------- 옷장 ---------- */
    #rack {
      position: absolute; left: 390px; top: 12px; width: 758px; height: 752px;
      transition: opacity .4s;
      z-index: 20;
    }
    #game.full #rack { opacity: 0; pointer-events: none; }
    #game.full #dollWrap { left: 430px; }
    #tabs { position: absolute; left: 10px; top: 4px; right: 10px; display: flex; gap: 8px; justify-content: center; }
    .tab {
      font-family: inherit; font-size: 18px;
      padding: 6px 13px 5px; white-space: nowrap;
      border: 3px solid #fff;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      color: #fff;
      cursor: pointer;
      text-shadow: 0 2px 0 rgba(90,0,110,.5);
      transition: transform .12s, background .12s;
    }
    .tab:hover { transform: translateY(-2px); background: rgba(255,255,255,.4); }
    .tab.active {
      background: linear-gradient(180deg, #fff 0%, #ffd6f2 100%);
      color: #c2188a; text-shadow: none;
      box-shadow: 0 4px 0 #b0187e;
    }
    #pieces { position: absolute; left: 0; top: 62px; width: 758px; height: 690px; }
    .piece {
      position: absolute;
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(0 5px 4px rgba(40,0,60,.35));
      transition: left .45s cubic-bezier(.4,1.5,.5,1), top .45s cubic-bezier(.4,1.5,.5,1), transform .15s, opacity .3s;
    }
    .piece svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .piece:hover { transform: scale(1.06) rotate(-2deg); filter: drop-shadow(0 0 6px #fff) drop-shadow(0 6px 5px rgba(40,0,60,.35)); }
    .piece.off { display: none; }
    .piece.worn { visibility: hidden; }
    .piece.flying { display: block !important; visibility: visible !important; }
    .piece.dragging {
      transition: none; cursor: grabbing; z-index: 1000;
      transform: scale(1.1) rotate(-3deg);
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 14px 10px rgba(40,0,60,.45));
    }
    .piece .tag {
      position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%);
      white-space: nowrap; font-size: 14px; color: #fff;
      background: rgba(120,20,140,.75); padding: 1px 8px; border-radius: 99px;
      opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .piece:hover .tag { opacity: 1; }
    .piece.dragging .tag { opacity: 0; }

    #hairPanel { position: absolute; left: 20px; top: 70px; right: 20px; display: none; color: #fff; }
    #hairPanel.show { display: block; }
    #hairPanel h3 { margin: 6px 4px 10px; font-size: 22px; font-weight: normal; text-shadow: 0 2px 0 rgba(90,0,110,.5); }
    .hair-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .hair-btn {
      width: 124px; border: 4px solid rgba(255,255,255,.6); border-radius: 22px;
      background: rgba(255,255,255,.85); cursor: pointer; padding: 4px 4px 2px;
      font-family: inherit; font-size: 16px; color: #8a1f78;
      transition: transform .12s;
    }
    .hair-btn:hover { transform: translateY(-3px); }
    .hair-btn.active { border-color: #ffe45c; box-shadow: 0 0 0 3px #ff5fb8; }
    .hair-btn svg { width: 100%; height: 130px; display: block; }
    .sw-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .sw {
      width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
      border: 4px solid #fff; box-shadow: 0 3px 6px rgba(0,0,0,.3);
      transition: transform .12s;
    }
    .sw:hover { transform: scale(1.1); }
    .sw.active { box-shadow: 0 0 0 4px #ff5fb8, 0 3px 6px rgba(0,0,0,.3); transform: scale(1.12); }

    /* ---------- 아래 버튼 ---------- */
    #toolbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
      display: flex; align-items: center; gap: 10px;
      padding: 0 24px;
      z-index: 25;
    }
    .logo {
      font-size: 30px; color: #fff; margin-right: auto;
      text-shadow: 0 3px 0 #b0187e, 0 0 12px #ff7be0;
      letter-spacing: 1px;
    }
    .cloud-btn {
      font-family: inherit; font-size: 21px;
      padding: 8px 20px 7px;
      border: 4px solid #fff;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff3fb 0%, #ffb6e4 100%);
      color: #c2188a;
      cursor: pointer;
      box-shadow: 0 4px 0 #b0187e, 0 0 14px rgba(255,255,255,.6);
      transition: transform .1s, box-shadow .1s;
    }
    .cloud-btn:hover { transform: translateY(-2px); }
    .cloud-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b0187e; }
    .cloud-btn.blue { background: linear-gradient(180deg, #f3fbff 0%, #a9dcff 100%); color: #1a64b0; box-shadow: 0 4px 0 #2a6cb0, 0 0 14px rgba(255,255,255,.6); }
    .cloud-btn.gold { background: linear-gradient(180deg, #fffbe8 0%, #ffe07a 100%); color: #a55d00; box-shadow: 0 4px 0 #c88a00, 0 0 14px rgba(255,255,255,.6); }

    /* ---------- 팝업 ---------- */
    .modal {
      position: fixed; inset: 0;
      background: rgba(40, 0, 60, .55);
      display: none; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: linear-gradient(180deg, #fff 0%, #ffeefa 100%);
      border-radius: 28px; padding: 18px;
      width: min(620px, 100%); max-height: 94vh; overflow: auto;
      border: 5px solid #ff9fe0; text-align: center; color: #8a1f78;
    }
    .modal-box h2 { margin: 0 0 12px; font-weight: normal; font-size: 28px; }
    .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .slot {
      border: 3px dashed #f3a6d8; border-radius: 20px; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .slot .thumb {
      aspect-ratio: 360 / 900; max-height: 42vh; margin: 0 auto; width: 100%;
      border-radius: 14px; overflow: hidden;
      background: radial-gradient(circle at 50% 70%, #ff9be8, #9a34d0);
      display: flex; align-items: center; justify-content: center; font-size: 36px;
    }
    .slot .thumb svg { width: 100%; height: 100%; }
    .slot .cloud-btn { font-size: 16px; padding: 6px 6px 5px; border-width: 3px; }
    #photoImg { max-width: 100%; max-height: 62vh; border-radius: 18px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .modal-actions .cloud-btn { text-decoration: none; }
    .hint { font-size: 15px; opacity: .8; margin: 8px 0 0; }

    .toast {
      position: fixed; left: 50%; top: 18px;
      transform: translateX(-50%) translateY(-20px);
      background: #fff; color: #c2188a;
      border: 4px solid #ff9fe0; padding: 8px 20px; border-radius: 999px;
      font-size: 20px; opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity .25s, transform .25s; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="game">
      <svg class="castle" viewBox="0 0 1160 170" preserveAspectRatio="none">
        <g fill="rgba(45,5,85,.55)">
          <path d="M0 170 V120 H40 V90 L60 60 L80 90 V120 H130 V100 H150 V120 H200 V170Z"/>
          <path d="M380 170 V110 H400 V70 L420 30 L440 70 V110 H470 V130 H490 V170Z"/>
          <path d="M620 170 V130 H660 V80 L690 20 L720 80 V130 H760 V100 L780 70 L800 100 V170Z"/>
          <path d="M960 170 V120 H990 V80 L1010 45 L1030 80 V120 H1080 V95 L1100 65 L1120 95 V170Z"/>
          <rect x="0" y="150" width="1160" height="20"/>
        </g>
        <g stroke="rgba(45,5,85,.55)" stroke-width="5">
          <path d="M200 150 H380 M490 150 H620 M800 150 H960"/>
          <path d="M210 150 V128 M230 150 V128 M250 150 V128 M270 150 V128 M290 150 V128 M310 150 V128 M330 150 V128 M350 150 V128 M370 150 V128
                   M500 150 V128 M520 150 V128 M540 150 V128 M560 150 V128 M580 150 V128 M600 150 V128
                   M810 150 V128 M830 150 V128 M850 150 V128 M870 150 V128 M890 150 V128 M910 150 V128 M930 150 V128 M950 150 V128"/>
        </g>
      </svg>
      <div id="twinkles"></div>

      <div id="dollWrap">
        <svg class="pedestal" viewBox="0 0 360 80">
          <defs>
            <linearGradient id="pedTop" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff7b0"/><stop offset="1" stop-color="#ffc21a"/>
            </linearGradient>
            <linearGradient id="pedSide" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#d98a00"/><stop offset=".5" stop-color="#ffd84a"/><stop offset="1" stop-color="#d98a00"/>
            </linearGradient>
          </defs>
          <path d="M30 34 V50 Q180 92 330 50 V34Z" fill="url(#pedSide)" stroke="#b86e00" stroke-width="2"/>
          <ellipse cx="180" cy="34" rx="150" ry="26" fill="url(#pedTop)" stroke="#e0a000" stroke-width="3"/>
          <ellipse cx="180" cy="34" rx="118" ry="17" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
          <g fill="#ff5fb8" stroke="#fff" stroke-width="1.5">
            <circle cx="52" cy="54" r="5"/><circle cx="92" cy="64" r="5"/><circle cx="136" cy="70" r="5"/>
            <circle cx="180" cy="72" r="5"/><circle cx="224" cy="70" r="5"/><circle cx="268" cy="64" r="5"/><circle cx="308" cy="54" r="5"/>
          </g>
        </svg>
        <svg id="doll" viewBox="0 0 360 900" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div id="rack">
        <div id="tabs"></div>
        <div id="pieces"></div>
        <div id="hairPanel"></div>
      </div>

      <div id="toolbar">
        <div class="logo">👑 공주님 옷 입히기</div>
        <button class="cloud-btn" id="resetBtn">원래대로</button>
        <button class="cloud-btn gold" id="randomBtn">🎲 랜덤</button>
        <button class="cloud-btn blue" id="fullBtn">전체모습</button>
        <button class="cloud-btn" id="photoBtn">📸 사진</button>
        <button class="cloud-btn gold" id="saveBtn">💾 저장</button>
      </div>
    </div>
  </div>

  <!-- 저장 / 불러오기 -->
  <div class="modal" id="saveModal">
    <div class="modal-box">
      <h2>💾 옷장 서랍</h2>
      <div class="slots" id="slots"></div>
      <p class="hint" id="saveHint"></p>
      <div class="modal-actions"><button class="cloud-btn blue" data-close>닫기</button></div>
    </div>
  </div>

  <!-- 사진 -->
  <div class="modal" id="photoModal">
    <div class="modal-box">
      <h2>📸 공주님 사진</h2>
      <img id="photoImg" alt="공주님 사진">
      <p class="hint">저장이 안 되면 사진을 길게 누르거나 오른쪽 클릭해서 저장하세요.</p>
      <div class="modal-actions">
        <a class="cloud-btn gold" id="photoDownload" download="princess.png">⬇️ 내려받기</a>
        <button class="cloud-btn blue" data-close>닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 옷 크기를 재기 위한 숨은 그림판 -->
  <svg id="measure" viewBox="0 0 360 900" width="360" height="900"
       style="position:absolute;left:-9999px;top:0;visibility:hidden"></svg>

  <script>
  // =====================================================================
  //  그림 도우미
  // =====================================================================
  function shade(hex, p) {
    var n = parseInt(hex.slice(1), 16);
    var r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    var t = p < 0 ? 0 : 255, a = Math.abs(p);
    r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  var mx = function (x) { return 360 - x; };
  // 왼쪽 절반 윤곽만 적으면 좌우 대칭 도형을 만들어 줍니다.
  function sym(start, segs) {
    var d = 'M' + start[0] + ' ' + start[1], pts = [start];
    segs.forEach(function (s) {
      d += ' ' + s[0] + s.slice(1).join(' ');
      pts.push([s[s.length - 2], s[s.length - 1]]);
    });
    var last = pts[pts.length - 1];
    d += ' L' + mx(last[0]) + ' ' + last[1];
    for (var i = segs.length - 1; i >= 0; i--) {
      var s = segs[i], prev = pts[i];
      if (s[0] === 'L') d += ' L' + mx(prev[0]) + ' ' + prev[1];
      else if (s[0] === 'Q') d += ' Q' + mx(s[1]) + ' ' + s[2] + ' ' + mx(prev[0]) + ' ' + prev[1];
      else if (s[0] === 'C') d += ' C' + mx(s[3]) + ' ' + s[4] + ' ' + mx(s[1]) + ' ' + s[2] + ' ' + mx(prev[0]) + ' ' + prev[1];
    }
    return d + 'Z';
  }
  var MIR = function (s) { return '<g transform="matrix(-1 0 0 1 360 0)">' + s + '</g>'; };
  var BOTH = function (s) { return s + MIR(s); };
  var OUT = function (c) { return shade(c, -0.4); };
  // 둥근 느낌을 주는 가로 그라디언트
  function G(id, c) {
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0" stop-color="' + shade(c, -0.22) + '"/><stop offset=".36" stop-color="' + shade(c, 0.25) + '"/>' +
      '<stop offset=".62" stop-color="' + c + '"/><stop offset="1" stop-color="' + shade(c, -0.28) + '"/></linearGradient>';
  }
  function VG(id, stops) {
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' + stops.map(function (s) {
      return '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"' + (s[2] != null ? ' stop-opacity="' + s[2] + '"' : '') + '/>';
    }).join('') + '</linearGradient>';
  }
  function SH(id) { // 무늬 옷 위에 덮는 그림자
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0" stop-color="#2a0030" stop-opacity=".28"/><stop offset=".35" stop-color="#fff" stop-opacity=".12"/>' +
      '<stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#2a0030" stop-opacity=".3"/></linearGradient>';
  }
  function fillAttr(id, c, w) {
    return 'fill="url(#' + id + ')" stroke="' + OUT(c) + '" stroke-width="' + (w || 1.6) + '" stroke-linejoin="round"';
  }
  function P(d, attr) { return '<path d="' + d + '" ' + attr + '/>'; }
  function line(d, c, w, extra) {
    return '<path d="' + d + '" stroke="' + c + '" stroke-width="' + (w || 1.2) + '" fill="none" stroke-linecap="round" stroke-linejoin="round" ' + (extra || '') + '/>';
  }
  function spark(x, y, r, c) {
    return '<path d="M' + x + ' ' + (y - r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + r) +
      ' Q' + x + ' ' + y + ' ' + (x - r) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - r) + 'Z" fill="' + (c || '#fff') + '"/>';
  }
  function starPath(cx, cy, R, r) {
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 ? r : R, a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push((cx + rad * Math.cos(a)).toFixed(1) + ' ' + (cy + rad * Math.sin(a)).toFixed(1));
    }
    return 'M' + pts.join(' L') + 'Z';
  }
  function heart(x, y, s, fill, stroke, sw) {
    return '<path d="M' + x + ' ' + (y + s * 0.9) + ' C' + (x - s * 1.4) + ' ' + y + ' ' + (x - s * 0.9) + ' ' + (y - s * 0.95) + ' ' + x + ' ' + (y - s * 0.35) +
      ' C' + (x + s * 0.9) + ' ' + (y - s * 0.95) + ' ' + (x + s * 1.4) + ' ' + y + ' ' + x + ' ' + (y + s * 0.9) + 'Z" fill="' + fill + '" stroke="' + (stroke || 'none') + '" stroke-width="' + (sw || 1.2) + '" stroke-linejoin="round"/>';
  }
  function flower(x, y, s, c, center) {
    var out = '';
    for (var i = 0; i < 5; i++) {
      var a = i * Math.PI * 2 / 5 - Math.PI / 2;
      out += '<circle cx="' + (x + Math.cos(a) * s).toFixed(1) + '" cy="' + (y + Math.sin(a) * s).toFixed(1) + '" r="' + (s * 0.85).toFixed(1) +
        '" fill="' + c + '" stroke="' + shade(c, -0.25) + '" stroke-width=".8"/>';
    }
    return out + '<circle cx="' + x + '" cy="' + y + '" r="' + (s * 0.6).toFixed(1) + '" fill="' + (center || '#ffd23f') + '"/>';
  }
  function rose(x, y, s, c) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + s + '" fill="' + c + '" stroke="' + shade(c, -0.3) + '" stroke-width="1"/>' +
      line('M' + (x - s * 0.5) + ' ' + y + ' Q' + x + ' ' + (y - s * 0.8) + ' ' + (x + s * 0.5) + ' ' + y + ' Q' + x + ' ' + (y + s * 0.5) + ' ' + (x - s * 0.2) + ' ' + (y - s * 0.1), shade(c, -0.3), 1);
  }
  function bow(x, y, s, c) {
    var d = shade(c, -0.35);
    return '<path d="M' + (x - 2) + ' ' + (y + 2) + ' L' + (x - s * 0.8) + ' ' + (y + s * 1.7) + ' L' + (x - s * 0.25) + ' ' + (y + s * 1.55) + 'Z M' +
      (x + 2) + ' ' + (y + 2) + ' L' + (x + s * 0.8) + ' ' + (y + s * 1.7) + ' L' + (x + s * 0.25) + ' ' + (y + s * 1.55) + 'Z" fill="' + shade(c, -0.1) + '" stroke="' + d + '" stroke-width="1.2" stroke-linejoin="round"/>' +

  function itemMarkup(it, p) {

  function dollMarkup(st, ctx, interactive) {
    var worn = st.worn || {};
    var wrap = function (slot, html) {
      return interactive ? '<g class="worn" data-item="' + worn[slot] + '">' + html + '</g>' : html;
    };
    var hair = HAIRS[st.hair];
    var out = hairDefs(ctx + 'h', st.hairColor) + hair.back(ctx + 'h', st.hairColor);
    SLOTS.forEach(function (slot) {
      var it = worn[slot] && ITEM_BY_ID[worn[slot]];
      if (it && it.back) out += wrap(slot, it.back(ctx + it.id + 'k'));
    });
    out += bodySVG(ctx + 'b', st.skin);
    LAYERS_UNDER.forEach(function (slot) {
      var it = worn[slot] && ITEM_BY_ID[worn[slot]];
      if (it) out += wrap(slot, it.draw(ctx + it.id));
    });
    out += hair.front(ctx + 'h', st.hairColor);
    LAYERS_OVER.forEach(function (slot) {
      var it = worn[slot] && ITEM_BY_ID[worn[slot]];
      if (it) out += wrap(slot, it.draw(ctx + it.id));
    });
    out += handsSVG(ctx + 'b', st.skin);
    return out;
  }

  var state = clone(DEFAULT);
  function sanitize(o) {
    var s = clone(DEFAULT);
    if (!o || typeof o !== 'object') return s;
    if (HAIRS[o.hair]) s.hair = o.hair;
    if (/^#[0-9a-fA-F]{6}$/.test(o.hairColor || '')) s.hairColor = o.hairColor.toLowerCase();
    if (/^#[0-9a-fA-F]{6}$/.test(o.skin || '')) s.skin = o.skin.toLowerCase();
    if (o.worn && typeof o.worn === 'object') {
      SLOTS.forEach(function (slot) {

  function measureItems() {
    var m = $('measure');
    ITEMS.forEach(function (it) {
      m.innerHTML = '<g id="mg">' + itemMarkup(it, 'm' + it.id) + '</g>';
      var b = document.getElementById('mg').getBBox();
      var pad = 7;
      BOX[it.id] = { x: b.x - pad, y: b.y - pad, w: b.width + pad * 2, h: b.height + pad * 2 };
    });
    m.innerHTML = '';
  }
  // 한 칸 안에 옷을 가장 크게 놓을 수 있는 배율을 찾아서 줄 맞춰 놓기
  function layoutPage(page) {
    var items = ITEMS.filter(function (it) { return page.slots.indexOf(it.slot) >= 0; });
    items.sort(function (a, b) { return page.slots.indexOf(a.slot) - page.slots.indexOf(b.slot); });
    var W = 740, H = 650, GAP_X = 14, GAP_Y = 26;
    function flow(s) {
      var rows = [], row = [], x = 0;
      items.forEach(function (it) {
        var w = BOX[it.id].w * s;
        if (row.length && x + w > W) { rows.push(row); row = []; x = 0; }
        row.push(it); x += w + GAP_X;
      });
      if (row.length) rows.push(row);
      var h = 0;
      rows.forEach(function (r) { h += Math.max.apply(null, r.map(function (it) { return BOX[it.id].h * s; })) + GAP_Y; });
      return { rows: rows, h: h - GAP_Y };
    }
    var s = page.max || 0.9, f = flow(s);
    while (f.h > H && s > 0.2) { s -= 0.01; f = flow(s); }
    var y = Math.max(0, (H - f.h) / 2);
    f.rows.forEach(function (r) {
      var rowW = r.reduce(function (acc, it) { return acc + BOX[it.id].w * s; }, 0) + GAP_X * (r.length - 1);
      var rowH = Math.max.apply(null, r.map(function (it) { return BOX[it.id].h * s; }));
      var x = (W - rowW) / 2 + 9;
      r.forEach(function (it) {
        var w = BOX[it.id].w * s, h = BOX[it.id].h * s;
        HOME[it.id] = { x: x, y: y + (rowH - h) / 2, w: w, h: h, page: page.id };
        x += w + GAP_X;
      });
      y += rowH + GAP_Y;
    });
  }
  function buildPieces() {
    PAGES.forEach(function (pg) { if (pg.slots.length) layoutPage(pg); });
    piecesEl.innerHTML = '';
    ITEMS.forEach(function (it) {
      var h = HOME[it.id], b = BOX[it.id];
      var el = document.createElement('div');
      el.className = 'piece';
      el.dataset.id = it.id;
      el.style.left = h.x + 'px'; el.style.top = h.y + 'px';
      el.style.width = h.w + 'px'; el.style.height = h.h + 'px';
      el.innerHTML = '<svg viewBox="' + b.x + ' ' + b.y + ' ' + b.w + ' ' + b.h + '" xmlns="http://www.w3.org/2000/svg">' +
        itemMarkup(it, 'r' + it.id) + '</svg><span class="tag">' + it.name + '</span>';
      el.addEventListener('pointerdown', function (e) { startDrag(e, it.id, false); });
      piecesEl.appendChild(el);
      PIECE[it.id] = el;
    });
  }
  function refreshPieces() {
    ITEMS.forEach(function (it) {
      var el = PIECE[it.id];
      el.classList.toggle('off', HOME[it.id].page !== curPage);
      el.classList.toggle('worn', state.worn[it.slot] === it.id);
    });
  }

  function renderTabs() {
    $('tabs').innerHTML = PAGES.map(function (pg) {
      return '<button class="tab' + (pg.id === curPage ? ' active' : '') + '" data-page="' + pg.id + '">' + pg.label + '</button>';
    }).join('');
    $('hairPanel').classList.toggle('show', curPage === 'hair');
    if (curPage === 'hair') renderHairPanel();
  }

  function renderHairPanel() {
    var html = '<h3>💇‍♀️ 머리 모양</h3><div class="hair-row">';
    HAIR_ORDER.forEach(function (key) {
      var prev = { hair: key, hairColor: state.hairColor, skin: state.skin, worn: {} };
      html += '<button class="hair-btn' + (state.hair === key ? ' active' : '') + '" data-hair="' + key + '">' +
        '<svg viewBox="60 -10 240 360">' + dollMarkup(prev, 'hp' + key, false) + '</svg>' + HAIRS[key].name + '</button>';
    });
    html += '</div><h3>🎨 머리 색깔</h3><div class="sw-row">';
    HAIR_COLORS.forEach(function (c) {
      html += '<div class="sw' + (state.hairColor === c ? ' active' : '') + '" style="background:' + c + '" data-hc="' + c + '"></div>';
    });
    html += '</div><h3>🌸 피부색</h3><div class="sw-row">';
    SKIN_COLORS.forEach(function (c) {
      html += '<div class="sw' + (state.skin === c ? ' active' : '') + '" style="background:' + c + '" data-skin="' + c + '"></div>';
    });
    $('hairPanel').innerHTML = html + '</div>';
  }

  // =====================================================================
  //  입히기 / 벗기기
  // =====================================================================
  function wear(id) {
    var it = ITEM_BY_ID[id];
    if (it.slot === 'dress') { delete state.worn.top; delete state.worn.bottom; }
    if (it.slot === 'top' || it.slot === 'bottom') delete state.worn.dress;
    state.worn[it.slot] = id;
    renderDoll(); refreshPieces();
  }
  function unwear(id) {
    var it = ITEM_BY_ID[id];
    if (state.worn[it.slot] === id) delete state.worn[it.slot];
    renderDoll(); refreshPieces();
  }

  // =====================================================================
  //  끌어서 놓기
  // =====================================================================
  var drag = null;
  var PIECES_X = 390, PIECES_Y = 12 + 62; // #rack + #pieces 위치
  function toStage(e) {
    var r = game.getBoundingClientRect();
    return { x: (e.clientX - r.left) / K, y: (e.clientY - r.top) / K };
  }
  function overDoll(pt) {
    var x = dollWrap.offsetLeft, y = dollWrap.offsetTop;
    return pt.x > x + 10 && pt.x < x + 290 && pt.y > y && pt.y < y + 760;
  }
  function startDrag(e, id, fromDoll) {
    if (drag) return;
    e.preventDefault();
    var el = PIECE[id], pt = toStage(e), h = HOME[id], offX, offY;
    if (fromDoll) {
      unwear(id);
      offX = h.w / 2; offY = h.h / 2;
      el.classList.add('flying');
    } else {
      offX = pt.x - (PIECES_X + h.x); offY = pt.y - (PIECES_Y + h.y);
    }
    el.classList.add('dragging');
    drag = { id: id, el: el, offX: offX, offY: offY, pointerId: e.pointerId };
    moveTo(pt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }
  function moveTo(pt) {
    drag.el.style.left = (pt.x - drag.offX - PIECES_X) + 'px';
    drag.el.style.top = (pt.y - drag.offY - PIECES_Y) + 'px';
    dollWrap.classList.toggle('hover', overDoll(pt));
  }
  function onMove(e) { if (drag && e.pointerId === drag.pointerId) moveTo(toStage(e)); }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    var pt = toStage(e), d = drag, h = HOME[d.id];
    drag = null;
    dollWrap.classList.remove('hover');
    d.el.classList.remove('dragging');
    if (overDoll(pt)) {
      // 공주님에게 쏙! 옷장 자리는 비워 둠
      d.el.style.transition = 'none';
      d.el.style.left = h.x + 'px'; d.el.style.top = h.y + 'px';
      d.el.classList.remove('flying');
      wear(d.id);
      void d.el.offsetWidth;
      d.el.style.transition = '';
      burst(pt.x, pt.y);
    } else {
      // 공주님 밖에 놓으면 제자리로 돌아가기
      d.el.style.left = h.x + 'px'; d.el.style.top = h.y + 'px';
      setTimeout(function () { d.el.classList.remove('flying'); }, 460);
    }
  }
  dollSvg.addEventListener('pointerdown', function (e) {
    var g = e.target.closest && e.target.closest('[data-item]');
    if (g) startDrag(e, g.getAttribute('data-item'), true);
  });

  function burst(x, y) {
    var icons = ['✨', '💖', '⭐', '✨', '💫', '🌸'];
    for (var i = 0; i < 9; i++) {
      var s = document.createElement('span');
      s.className = 'burst';
      s.textContent = icons[i % icons.length];
      s.style.left = (x - 13) + 'px'; s.style.top = (y - 13) + 'px';
      var a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 70;
      s.style.setProperty('--dx', (Math.cos(a) * r).toFixed(0) + 'px');
      s.style.setProperty('--dy', (Math.sin(a) * r).toFixed(0) + 'px');
      game.appendChild(s);
      setTimeout(function (el) { el.remove(); }, 950, s);
    }
  }

  // =====================================================================
  //  버튼들
  // =====================================================================
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function randomize() {
    var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
    var bySlot = function (slot) { return ITEMS.filter(function (it) { return it.slot === slot; }); };
    var w = {};
    if (Math.random() < 0.5) w.dress = pick(bySlot('dress')).id;
    else { w.top = pick(bySlot('top')).id; w.bottom = pick(bySlot('bottom')).id; }
    w.shoes = pick(bySlot('shoes')).id;
    var chance = { outer: 0.35, socks: 0.35, head: 0.75, necklace: 0.5, glasses: 0.15, bag: 0.35, hand: 0.35 };
    Object.keys(chance).forEach(function (slot) { if (Math.random() < chance[slot]) w[slot] = pick(bySlot(slot)).id; });
    state.worn = w;
    state.hair = pick(HAIR_ORDER);
    state.hairColor = pick(HAIR_COLORS);
    renderDoll(); refreshPieces(); renderTabs();
    burst(210, 300); burst(210, 560);
    toast('🎲 짜잔! 새로운 코디예요');
  }

  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-page]');
    if (!b) return;
    curPage = b.dataset.page;
    renderTabs(); refreshPieces();
  });
  $('hairPanel').addEventListener('click', function (e) {
    var b = e.target.closest('[data-hair],[data-hc],[data-skin]');
    if (!b) return;
    if (b.dataset.hair) state.hair = b.dataset.hair;
    if (b.dataset.hc) state.hairColor = b.dataset.hc;
    if (b.dataset.skin) state.skin = b.dataset.skin;
    renderDoll(); renderHairPanel();
  });
  $('resetBtn').addEventListener('click', function () {
    state.worn = {};
    renderDoll(); refreshPieces();
    toast('🔄 옷을 모두 옷장에 돌려놨어요');
  });
  $('randomBtn').addEventListener('click', randomize);
  $('fullBtn').addEventListener('click', function () {
    var full = game.classList.toggle('full');
    $('fullBtn').textContent = full ? '옷장 열기' : '전체모습';
  });

  // =====================================================================
  //  사진 찍기
  // =====================================================================
  function sceneSVG(W, H) {
    var rays = '';
    for (var i = 0; i < 24; i++) {
      var a1 = i * Math.PI / 12, a2 = a1 + Math.PI / 30;
      rays += 'M300 620 L' + (300 + Math.cos(a1) * 1200).toFixed(0) + ' ' + (620 + Math.sin(a1) * 1200).toFixed(0) +
        ' L' + (300 + Math.cos(a2) * 1200).toFixed(0) + ' ' + (620 + Math.sin(a2) * 1200).toFixed(0) + 'Z ';
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="' + W + '" height="' + H + '">' +
      '<defs><radialGradient id="pbg" cx=".5" cy=".62" r=".75"><stop offset="0" stop-color="#ff8be6"/><stop offset=".35" stop-color="#d046dc"/>' +
      '<stop offset=".7" stop-color="#8a26c9"/><stop offset="1" stop-color="#45107f"/></radialGradient>' +
      '<linearGradient id="ppt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7b0"/><stop offset="1" stop-color="#ffc21a"/></linearGradient></defs>' +
      '<rect width="600" height="1000" fill="url(#pbg)"/><path d="' + rays + '" fill="#fff" opacity=".12"/>' +
      '<ellipse cx="300" cy="940" rx="180" ry="30" fill="url(#ppt)" stroke="#e0a000" stroke-width="3"/>' +
      '<g transform="translate(120 60)">' + dollMarkup(state, 'x', false) + '</g>' +
      '<text x="300" y="990" text-anchor="middle" font-size="26" fill="#fff" font-family="Jua, sans-serif">공주님 옷 입히기</text></svg>';
  }
  function takePhoto() {
    var img = new Image(), W = 600, H = 1000;
    img.onload = function () {
      var cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      cv.getContext('2d').drawImage(img, 0, 0, W, H);
      var url;
      try { url = cv.toDataURL('image/png'); } catch (e) { url = img.src; }
      $('photoImg').src = url;
      $('photoDownload').href = url;
      $('photoModal').classList.add('open');
    };
    img.onerror = function () { toast('앗, 사진을 만들지 못했어요'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sceneSVG(W, H));
  }
  $('photoBtn').addEventListener('click', takePhoto);

  // =====================================================================
  //  저장 / 불러오기 (구글 앱스 스크립트, 없으면 브라우저에 저장)
  // =====================================================================
  var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  var LOCAL_KEY = 'princess_dressup_v2';
  var localApi = {
    getOutfits: function () {
      try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || [null, null, null]; } catch (e) { return [null, null, null]; }
    },
    saveOutfit: function (slot, outfit) {
      var list = localApi.getOutfits();
      list[slot - 1] = Object.assign({}, outfit, { savedAt: new Date().toISOString() });
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
      return list[slot - 1];
    },
    deleteOutfit: function (slot) {
      var list = localApi.getOutfits();
      list[slot - 1] = null;
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
      return true;
    }
  };
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (HAS_GAS) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fn].apply(runner, args);
      } else {
        try { resolve(localApi[fn].apply(null, args)); } catch (e) { reject(e); }
      }
    });
  }
  var slotData = [null, null, null];
  function errMsg(e) { return e && e.message ? e.message : String(e); }
  function openSaveModal() {
    $('saveModal').classList.add('open');
    $('saveHint').textContent = '불러오는 중... ⏳';
    $('slots').innerHTML = '';
    api('getOutfits').then(function (list) {
      slotData = list || [null, null, null];
      renderSlots();
      $('saveHint').textContent = HAS_GAS ? '구글 계정에 저장돼요 ☁️' : '이 브라우저에 저장돼요 💻';
    }).catch(function (e) { $('saveHint').textContent = '앗, 불러오지 못했어요: ' + errMsg(e); });
  }
  function renderSlots() {
    $('slots').innerHTML = slotData.map(function (o, i) {
      var n = i + 1;
      var thumb = o ? '<svg viewBox="0 -10 360 910">' + dollMarkup(sanitize(o), 's' + n, false) + '</svg>' : '👗';
      return '<div class="slot"><div class="thumb">' + thumb + '</div>' +
        '<button class="cloud-btn" data-save="' + n + '">💾 여기 저장</button>' +
        (o ? '<button class="cloud-btn gold" data-load="' + n + '">👗 입히기</button>' +
             '<button class="cloud-btn blue" data-del="' + n + '">🗑️ 지우기</button>' : '') + '</div>';
    }).join('');
  }
  $('slots').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var n = +(b.dataset.save || b.dataset.load || b.dataset.del);
    if (b.dataset.save) {
      if (slotData[n - 1] && !confirm(n + '번 서랍의 옷을 지금 옷으로 바꿀까요?')) return;
      $('saveHint').textContent = '저장하는 중... ⏳';
      api('saveOutfit', n, state).then(function (saved) {
        slotData[n - 1] = saved; renderSlots();
        $('saveHint').textContent = '';
        toast('💾 ' + n + '번 서랍에 저장했어요!');
      }).catch(function (err) { $('saveHint').textContent = '앗, 저장하지 못했어요: ' + errMsg(err); });
    } else if (b.dataset.load) {
      state = sanitize(slotData[n - 1]);
      renderDoll(); refreshPieces(); renderTabs();
      $('saveModal').classList.remove('open');
      burst(210, 400);
      toast('👗 ' + n + '번 서랍의 옷을 입었어요!');
    } else if (b.dataset.del) {
      if (!confirm(n + '번 서랍을 비울까요?')) return;
      api('deleteOutfit', n).then(function () { slotData[n - 1] = null; renderSlots(); });
    }
  });
  $('saveBtn').addEventListener('click', openSaveModal);
  document.querySelectorAll('.modal').forEach(function (m) {
    m.addEventListener('click', function (e) {
      if (e.target === m || e.target.hasAttribute('data-close')) m.classList.remove('open');
    });
  });

  // =====================================================================
  //  화면 크기 맞추기 + 시작
  // =====================================================================
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    K = Math.min(vw / 1180, vh / 850);
    game.style.transform = 'scale(' + K + ')';
    game.style.left = ((vw - 1160 * K) / 2) + 'px';
    game.style.top = ((vh - 830 * K) / 2) + 'px';
  }
  window.addEventListener('resize', fit);

  (function makeTwinkles() {
    var box = $('twinkles'), html = '';
    for (var i = 0; i < 26; i++) {
      html += '<span class="twinkle" style="left:' + (Math.random() * 1130).toFixed(0) + 'px;top:' + (Math.random() * 740).toFixed(0) +
        'px;font-size:' + (10 + Math.random() * 18).toFixed(0) + 'px;animation-delay:' + (Math.random() * 2.4).toFixed(2) + 's">✦</span>';
    }
    box.innerHTML = html;
  })();

  fit();
  measureItems();
  buildPieces();
  renderTabs();
  refreshPieces();
  renderDoll();
  </script>
</body>
</html>
